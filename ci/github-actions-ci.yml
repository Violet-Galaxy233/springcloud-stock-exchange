# GitHub Actions CI 工作流。
#
# 由于当前提交所用的令牌不具备 `workflow` 权限，无法直接写入 .github/workflows/，
# 因此将文件放在此处。启用方法（在本地执行一次即可）：
#
#     mkdir -p .github/workflows
#     git mv ci/github-actions-ci.yml .github/workflows/ci.yml
#     git commit -m "ci: enable GitHub Actions" && git push
#
# 之后每次 push / PR 都会自动构建并测试。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 聚合模块 build/pom.xml 会编译全部模块并运行测试
      # (交易引擎的单元测试与内嵌 Kafka 集成测试均不依赖外部中间件)。
      - name: Build and test
        run: mvn -B -ntp -f build/pom.xml clean verify

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            */target/*.jar
          retention-days: 5
          if-no-files-found: ignore
