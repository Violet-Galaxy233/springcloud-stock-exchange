# 交易 API 服务配置
server:
  port: 8001

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/exchange?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

exchange:
  # 交易引擎内部查询接口地址 (API -> Engine 的 query)
  engine-api-endpoint: ${ENGINE_API:http://localhost:8002}
  jwt:
    # HS256 密钥 (至少 32 字节)。生产环境务必用环境变量注入随机强密钥。
    secret: ${JWT_SECRET:warp-exchange-please-change-this-secret-key-32bytes+}
    # token 有效期 (秒)，默认 1 天。
    expires-in-seconds: ${JWT_EXPIRES:86400}
