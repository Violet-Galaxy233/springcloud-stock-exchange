# 本地开发所需的基础中间件：Kafka(+ZooKeeper)、Redis、MySQL。
# 用法：
#   docker compose up -d       启动
#   docker compose down        停止 (保留数据)
#   docker compose down -v      停止并清空数据卷
#
# 各服务均暴露标准端口，业务应用直接连接 localhost 即可。

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: warp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: warp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 供宿主机应用连接的地址:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 自动创建主题 (sequence / trade / tick):
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7
    container_name: warp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mysql:
    image: mysql:8.0
    container_name: warp-mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      # 首次启动时用 schema.sql 初始化表结构:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - mysql-data:/var/lib/mysql

volumes:
  redis-data:
  mysql-data:
